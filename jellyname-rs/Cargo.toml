[package]
name = "jellyname-rs"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI tool to rename MakeMKV rips for Jellyfin"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
tmdb-api = { version = "0.9.1", features = ["commands"] }
matroska = "0.30.1"
tokio = { version = "1", features = ["full"] }
strfmt = "0.2"
glob = "0.3"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
