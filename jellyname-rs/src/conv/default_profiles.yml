h265_reencode:
  description: High quality re-encode using x265
  video_codec: libx265
  audio_codec: aac
  preset: slow
  crf: 20
  audio_bitrate: 320k

fast_h264:
  description: Fast re-encode using x264 with lower quality
  video_codec: libx264
  audio_codec: copy
  preset: veryfast
  crf: 28

high_quality_h264:
  description: High quality re-encode using x264
  video_codec: libx264
  audio_codec: copy
  preset: slow
  crf: 20

h265_qsv_high:
  description: High quality GPU H.265 via Intel QuickSync (global_quality 18)
  video_codec: qsv_h265
  audio_codec: aac
  preset: medium
  crf: 18
  audio_bitrate: 320k
  hwaccel: qsv

h265_qsv_medium:
  description: Balanced GPU H.265 via Intel QuickSync (global_quality 22)
  video_codec: qsv_h265
  audio_codec: aac
  preset: medium
  crf: 22
  audio_bitrate: 320k
  hwaccel: qsv

h265_qsv_fast:
  description: Fast GPU H.265 via Intel QuickSync (global_quality 26)
  video_codec: qsv_h265
  audio_codec: aac
  preset: fast
  crf: 26
  audio_bitrate: 320k
  hwaccel: qsv

copy_streams:
  description: Copy both video and audio streams (no re-encode)
  video_codec: copy
  audio_codec: copy
